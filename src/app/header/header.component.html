<header class="app-header" [class.blurred-overlay]="navbarService.isDisabled()">
  <div class="brand-container">
    <span class="material-symbols-outlined brand-icon">hive</span>
    <span class="brand-title">HiveHub</span>
  </div>
  <div class="status-badge" [class.online]="networkStatus.online()" [class.offline]="!networkStatus.online()">
    <span class="status-text">
      {{ networkStatus.online() ? 'ONLINE' : 'OFFLINE' }}
    </span>
    <span class="material-symbols-outlined status-icon">
      {{ networkStatus.online() ? 'wifi' : 'wifi_off' }}
    </span>
  </div>
</header>
