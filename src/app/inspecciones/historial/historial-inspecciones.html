<div class="historial-container">

  <!-- Header Neo-brutalista -->
  <header class="historial-header">
    <button
      [routerLink]="['/apiarios', apiarioId]"
      aria-label="Volver"
      class="btn-back sink-effect"
    >
      <span class="material-symbols-outlined">arrow_back</span>
    </button>

    <div class="header-title-wrapper">
      <p class="header-subtitle">
        APIARIO {{ apiario()?.name ?? '' }}
      </p>
      <h1 class="header-title">
        HISTORIAL INSPECCIONES
      </h1>
    </div>

    <div class="header-spacer"></div>
  </header>

  <!-- Main Content -->
  <main class="historial-main">

    <!-- Loader -->
    <div *ngIf="loading()" class="loader-box">
      <p>Cargando historial de inspecciones...</p>
    </div>

    <!-- Lista de Registros -->
    <div *ngIf="!loading()" class="registros-section">
      <p class="section-title">Registros Realizados</p>

      <div
        *ngFor="let insp of inspecciones()"
        (click)="verInspeccion(insp)"
        class="inspeccion-card sink-effect"
      >
        <!-- Fila Fecha & Estado -->
        <div class="card-header">
          <div class="card-date-group">
            <span class="material-symbols-outlined card-date-icon">calendar_today</span>
            <span class="card-date-text">{{ formatFecha(insp.fecha) }}</span>
          </div>

          <!-- Badge de Estado -->
          <span *ngIf="insp.estado === 'EN_BORRADOR'" class="badge-estado badge-borrador">
            <span class="material-symbols-outlined badge-icon">edit_note</span> EN BORRADOR
          </span>
          <span *ngIf="insp.estado === 'SINCRONIZADA'" class="badge-estado badge-sincronizada">
            <span class="material-symbols-outlined badge-icon">check_circle</span> SINCRONIZADA
          </span>
        </div>

        <!-- Fila Floración -->
        <div class="card-floracion-group">
          <span>Floración: <strong>{{ insp.floracion }}</strong></span>
        </div>
      </div>

      <!-- Estado vacío -->
      <div *ngIf="inspecciones().length === 0" class="empty-state">
        <p>No hay inspecciones registradas en este apiario.</p>
      </div>
    </div>

    <!-- Botón Flotante Nueva Inspección -->
    <div class="btn-nueva-container">
      <button (click)="crearNuevaInspeccion()" class="btn-nueva-inspeccion sink-effect">
        <span class="material-symbols-outlined btn-icon">add</span>
        NUEVA INSPECCIÓN
      </button>
    </div>
  </main>

  <!-- Navbar Global Universal -->
  <app-navbar></app-navbar>
</div>
